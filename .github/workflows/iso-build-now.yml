name: LunnaOS Polaris — ISO build now

on:
  push:
    branches: [iso-build-now]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source
        run: bash ./build_files/validate.sh

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build LunnaOS container image
        run: |
          sudo podman build --pull=newer --tag localhost/lunnaos-polaris:iso-build .

      - name: Build bootc installer ISO
        run: |
          sudo mkdir -p output/iso
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$PWD/disk_config/iso.toml:/config.toml:ro,Z" \
            -v "$PWD/output/iso:/output:Z" \
            -v "/var/lib/containers/storage:/var/lib/containers/storage" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type bootc-generic-iso \
            --rootfs=btrfs \
            --config /config.toml \
            localhost/lunnaos-polaris:iso-build

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunnaOS-Polaris-ISO-build
          path: output/iso/**/*
          if-no-files-found: error
